name: Deploy app

# Publishes Firestore rules first, then the web app, whenever app files change on main.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firestore.rules"
      - "firebase.json"
      - "worker/tools/build-web.cjs"
      - "worker/tools/sdk/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Stamp build version
        run: |
          printf '// Generated at deploy time\nself.KW_BUILD={"commit":"%s","builtAt":"%s"};\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ../public/build-info.js
      - run: npm run build:web
      - name: Deploy Firestore rules, then Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          KEY="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY"
          PROJECT=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).project_id)" "$KEY")
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY"
          cd ..
          worker/node_modules/.bin/firebase deploy --project "$PROJECT" --only firestore:rules --non-interactive
          worker/node_modules/.bin/firebase deploy --project "$PROJECT" --only hosting --non-interactive -m "github ${GITHUB_SHA::7}"
          rm -f "$KEY"
