name: Tests
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25.9.0]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Run npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - run: npm run test:rules

      - name: Save test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-diagnostics-node-${{ matrix.node }}-${{ github.run_id }}
          path: |
            worker/agent-out/
            worker/test-output.log
            firestore-debug.log
            worker/firestore-debug.log
            firebase-debug.log
            worker/firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize test failure
        if: failure()
        run: |
          node <<'NODE'
          const fs = require('fs');
          if (fs.existsSync('test-output.log')) {
            const tail = fs.readFileSync('test-output.log', 'utf8').split('\n').slice(-100).join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### npm test output (last 100 lines)\n\n```text\n' + tail + '\n```\n');
          }
          NODE
