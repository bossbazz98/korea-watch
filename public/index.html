<!doctype html>
<html lang="th" data-release="20261111-pwa-segments">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korea Watch</title>
<meta name="description" content="ข่าวด่วนในเกาหลีใต้สำหรับคนไทย แปลและสรุปเป็นภาษาไทย">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Korea Watch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16181C">
<script>try { const mode=JSON.parse(localStorage.getItem('kw.theme'))||'dark'; document.documentElement.dataset.theme=mode==='light'||(mode==='system'&&!matchMedia('(prefers-color-scheme:dark)').matches)?'light':'dark'; } catch { document.documentElement.dataset.theme='dark'; }</script>
<link rel="preload" href="/fonts/sarabun-thai-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-thai-thai-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/liquid-glass.css">
<link rel="stylesheet" href="/settings.css">
<link rel="stylesheet" href="/ui-layout.css">
<link rel="stylesheet" href="/interactions.css">
</head>
<body>
<header class="top glass" id="home-header">
  <div class="wrap">
    <button class="brand" id="home-top" type="button" aria-label="กลับด้านบนสุด">
      <img class="logo" src="/icons/icon-192.png" alt="" width="38" height="38">
      <div style="min-width:0"><h1>KOREA WATCH</h1></div>
    </button>
    <div class="tools">
      <button class="icon-button glass" id="install">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 7v7m-3-3 3 3 3-3"/></svg>
        <span class="sr-only" id="install-l">ติดตั้ง</span>
      </button>
    </div>
  </div>
</header>
<div class="pull-space" id="pull-space" hidden>
  <div id="pull-refresh" class="pull-refresh" role="status" aria-live="polite" aria-atomic="true" hidden>
    <svg class="pull-ring" viewBox="0 0 24 24" role="progressbar" aria-label="ระยะดึงเพื่อรีเฟรช" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle class="pull-track" cx="12" cy="12" r="9"/>
      <circle class="pull-progress" cx="12" cy="12" r="9" pathLength="100"/>
      <circle class="pull-point" cx="12" cy="12" r="2.7" fill="currentColor" stroke="none"/>
      <path class="pull-check" d="m7 12 3 3 7-7"/>
      <path class="pull-error" d="m8 8 8 8m0-8-8 8"/>
    </svg>
    <span class="pull-message sr-only">ดึงเพื่อรีเฟรช</span>
  </div>
</div>
<div class="strip" id="strip" hidden><div class="wrap"><span class="dot"></span><b id="strip-k">ด่วน</b><button id="strip-t"></button></div></div>
<div class="offline" id="offline" hidden></div>
<p class="refresh-status" id="refresh-status" role="status" aria-live="polite" hidden></p>

<main class="wrap home-main" id="home-page">
  <section class="topics-section">
    <div class="sec-h"><div class="ttl"><h2 id="t-topics">หมวดข่าว</h2></div><span class="sub" id="t-30">ปัดดูหมวดเพิ่ม</span></div>
    <div class="rail tiles" id="tiles"></div>
  </section>
  <section class="featured-news-section">
    <div class="sec-h">
      <div class="ttl"><h2 id="t-bk">ข่าวเด่น</h2><div class="sub" id="t-bksub"></div></div>
      <div class="nav"><button id="bk-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg></button><button id="bk-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg></button></div>
    </div>
    <div class="rail bk" id="bk"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>
  <section class="all-news-section">
    <div class="sec-h"><div class="ttl"><h2 id="t-all">ข่าวทั้งหมด</h2></div><span class="sub" id="t-filter"></span></div>
    <div class="grid" id="grid"></div>
  </section>
  <p class="note" id="t-foot"></p>

</main>

<section id="saved-page" class="app-page" hidden>
  <header class="topbar glass app-page-header"><div class="saved-header-row"><h1 class="page-title" id="saved-title">ข่าวที่บันทึกไว้</h1><div class="saved-header-actions"><span class="head-count" id="saved-count"></span><button class="icon-button glass" id="saved-search-toggle" aria-label="ค้นหาข่าวที่บันทึกไว้" aria-expanded="false" aria-controls="saved-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button></div></div><input class="saved-search" id="saved-search" type="search" aria-label="ค้นหาข่าวที่บันทึกไว้" placeholder="ค้นหาข่าวที่บันทึกไว้" hidden></header>
  <main class="saved-main wrap" id="saved-content"></main>
</section>
<nav class="tabbar dock-frame glass" id="app-tabs" aria-label="เมนูหลัก">
  <span class="tab-lens glass" aria-hidden="true"></span>
  <button class="tab active" id="nav-home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3z"/></svg><span id="nav-home-label">หน้าแรก</span></button>
  <button class="tab" id="nav-saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span id="nav-saved-label">บันทึก</span></button>
  <button class="tab" id="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3H9Z"/><circle cx="12" cy="12" r="3"/></svg><span id="settings-l">ตั้งค่า</span></button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" id="panel"></div></div>
<div class="alert" id="alert" hidden><div class="box glass" role="alertdialog" aria-modal="true" id="alert-box"></div></div>
<div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/firebase-config.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
